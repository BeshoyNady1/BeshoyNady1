  <rect x="2" y="2" width="1196" height="276" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.4" />

  <rect x="440" y="34" width="320" height="28" rx="14" fill="#1E293B" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.6" />
  <text x="600" y="53" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="700" fill="#D4AF37" letter-spacing="2.5" text-anchor="middle">
