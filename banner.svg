  </text>

  <text x="600" y="122" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">
